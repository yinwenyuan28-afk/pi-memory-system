<!doctype html>
<!--
	L1 原子记忆页（Vue 3 + Element Plus）。

	骨架分界：`#nav` 与 `#modeBanner` 由 viewer-core 的 mountChrome 直接写 DOM（gate ⑰ 钉住的
	打开方式契约：页内跳转必须带 location.search、缺 ?port= 要给可操作提示、桥地址按页面自身
	hostname 拼），**必须留在 Vue 挂载点之外** —— 放进 #app 会被 Vue 的重渲染擦掉。
	`#app` 里的一切由 assets/records-app.js 负责。

	本页多加载一个 quality-core.js（质量分与 judgePrune 的单一实现，与 memory/l1/quality.ts 的
	数值一致性由 scripts/verify-viewer-quality-parity.ts 断言全等）。

	脚本顺序是硬约束（Vue → Element Plus → locale → viewer-core → viewer-vue → 页面），
	理由见 assets/vendor/README.md。样式顺序：EP 主题 → EP 暗色 → 本仓库主题（后者覆盖前两者）。
-->
<html lang="zh-CN" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>L1 原子记忆 · records + 质量分 + 任务状态</title>
		<link rel="stylesheet" href="assets/vendor/element-plus/index.css" />
		<link rel="stylesheet" href="assets/vendor/element-plus/dark.css" />
		<link rel="stylesheet" href="assets/viewer-theme.css" />
	</head>
	<body>
		<div class="nav" id="nav"></div>
		<div id="modeBanner" class="notice" style="display: none"></div>

		<div id="app"></div>

		<script src="assets/vendor/vue.global.prod.js"></script>
		<script src="assets/vendor/element-plus/index.full.min.js"></script>
		<script src="assets/vendor/element-plus/locale-zh-cn.min.js"></script>
		<script src="assets/viewer-core.js"></script>
		<script src="assets/quality-core.js"></script>
		<script src="assets/viewer-vue.js"></script>
		<script src="assets/records-app.js"></script>
	</body>
</html>
