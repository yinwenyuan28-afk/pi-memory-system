<!doctype html>
<!--
	L3 画像层（Vue 3 + Element Plus）。

	骨架分界：`#nav` 与 `#modeBanner` 由 viewer-core 的 mountChrome 直接写 DOM（它是 gate ⑰ 钉住的
	打开方式契约：页内跳转必须带 location.search、缺 ?port= 要给可操作提示、桥地址按页面自身 hostname
	拼），**必须留在 Vue 挂载点之外** —— 放进 #app 会被 Vue 的重渲染擦掉。
	`#app` 里的一切由 assets/l3-app.js 负责（模板写在那个文件里，HTML 这边只留挂载点）。

	脚本顺序是硬约束（Vue → Element Plus → locale → viewer-core → viewer-vue → 页面），
	理由见 assets/vendor/README.md。样式顺序：EP 主题 → EP 暗色 → 本仓库主题（后者覆盖前两者）。
-->
<html lang="zh-CN" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>try { if (localStorage.getItem("viewer-theme") === "light") document.documentElement.className = "light"; } catch (e) {}</script>
		<title>L3 画像层 · 游标 / MEMORY / USER / 提议稿</title>
		<link rel="stylesheet" href="assets/vendor/element-plus/index.css" />
		<link rel="stylesheet" href="assets/vendor/element-plus/dark.css" />
		<link rel="stylesheet" href="assets/viewer-theme.css" />
	</head>
	<body>
		<div class="nav" id="nav"></div>
		<div id="modeBanner" class="notice" style="display: none"></div>

		<div id="app"></div>

		<script src="assets/vendor/vue.global.prod.js"></script>
		<script src="assets/vendor/element-plus/index.full.min.js"></script>
		<script src="assets/vendor/element-plus/locale-zh-cn.min.js"></script>
		<script src="assets/viewer-i18n.js"></script>
		<script src="assets/viewer-core.js"></script>
		<script src="assets/viewer-vue.js"></script>
		<script src="assets/l3-app.js"></script>
	</body>
</html>
